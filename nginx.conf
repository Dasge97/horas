# Sirve el panel y el ranking. El repositorio entero está montado en /datos,
# pero solo se exponen panel/ y los dos JSON públicos.
server {
    listen 8080;
    server_name _;
    root /datos/panel;
    index index.html;

    location = /ranking.json {
        alias /datos/ranking.json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /horas.json {
        alias /datos/horas.json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
